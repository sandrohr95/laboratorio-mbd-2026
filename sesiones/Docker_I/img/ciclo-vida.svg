<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="c" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#db7810"/></marker>
  </defs>
  <rect width="960" height="380" rx="18" fill="#ffffff"/>

  <g font-size="18" font-weight="700" text-anchor="middle" fill="#1f1f1f">
    <rect x="30" y="150" width="140" height="70" rx="35" fill="#dceefd" stroke="#2f80c8" stroke-width="2"/>
    <text x="100" y="191">Imagen</text>
    <rect x="250" y="150" width="140" height="70" rx="35" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="320" y="191">Creado</text>
    <rect x="470" y="150" width="160" height="70" rx="35" fill="#eef5d3" stroke="#8aa61f" stroke-width="3"/>
    <text x="550" y="191">En marcha</text>
    <rect x="470" y="290" width="160" height="60" rx="30" fill="#fff6d6" stroke="#c9a400" stroke-width="2"/>
    <text x="550" y="326">En pausa</text>
    <rect x="720" y="150" width="160" height="70" rx="35" fill="#fbe3c8" stroke="#db7810" stroke-width="2"/>
    <text x="800" y="182">Parado</text>
    <text x="800" y="205" font-size="13" font-weight="400" fill="#555">(exited)</text>
    <rect x="720" y="20" width="160" height="60" rx="30" fill="#ececec" stroke="#aaa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="800" y="56" fill="#777">Borrado</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#db7810" font-weight="700" text-anchor="middle">
    <line x1="172" y1="185" x2="243" y2="185" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="208" y="172">create</text>
    <line x1="392" y1="185" x2="463" y2="185" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="428" y="172">start</text>
    <path d="M100,148 C100,90 450,90 520,145" fill="none" stroke="#db7810" stroke-width="3" marker-end="url(#c)" stroke-dasharray="7 5"/>
    <text x="300" y="92">run = create + start</text>
    <line x1="632" y1="172" x2="713" y2="172" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="672" y="160">stop · kill</text>
    <path d="M720,205 C690,240 660,240 635,212" fill="none" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="700" y="280">start · restart</text>
    <line x1="530" y1="223" x2="530" y2="283" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="490" y="258" text-anchor="end">pause</text>
    <line x1="570" y1="287" x2="570" y2="227" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="580" y="258" text-anchor="start">unpause</text>
    <line x1="800" y1="146" x2="800" y2="86" stroke="#db7810" stroke-width="3" marker-end="url(#c)"/>
    <text x="830" y="122" text-anchor="start">rm</text>
    <path d="M560,147 C580,60 650,50 715,50" fill="none" stroke="#aaa" stroke-width="2" marker-end="url(#c)" stroke-dasharray="5 5"/>
    <text x="640" y="40" fill="#888">rm -f</text>
  </g>
  <text x="550" y="245" text-anchor="middle" font-size="12" fill="#555"></text>
  <text x="30" y="360" font-size="13" fill="#555">El contenedor también pasa a «Parado» cuando su proceso principal termina (por ejemplo, al acabar un script).</text>
</svg>
