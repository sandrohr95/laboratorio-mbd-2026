<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#db7810"/></marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f" font-family="ui-monospace, Menlo, monospace">docker run -p 8080:80 nginx:alpine</text>

  <rect x="30" y="80" width="200" height="140" rx="14" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
  <text x="130" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1f1f1f">Navegador</text>
  <text x="130" y="160" text-anchor="middle" font-size="14" fill="#555" font-family="ui-monospace, Menlo, monospace">localhost:8080</text>

  <rect x="300" y="60" width="630" height="200" rx="14" fill="#f3f8fd" stroke="#2f80c8" stroke-width="2"/>
  <text x="320" y="88" font-size="15" font-weight="700" fill="#2f80c8">Tu ordenador (anfitrión)</text>
  <rect x="330" y="120" width="130" height="80" rx="12" fill="#dceefd" stroke="#2f80c8" stroke-width="2"/>
  <text x="395" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1f1f">puerto</text>
  <text x="395" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2f80c8" font-family="ui-monospace, Menlo, monospace">8080</text>

  <rect x="590" y="100" width="320" height="140" rx="14" fill="#eef5d3" stroke="#8aa61f" stroke-width="2"/>
  <text x="610" y="128" font-size="15" font-weight="700" fill="#5c7212">Contenedor · red aislada</text>
  <rect x="620" y="145" width="130" height="80" rx="12" fill="#ffffff" stroke="#8aa61f" stroke-width="2"/>
  <text x="685" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1f1f">puerto</text>
  <text x="685" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#5c7212" font-family="ui-monospace, Menlo, monospace">80</text>
  <text x="830" y="190" text-anchor="middle" font-size="15" fill="#1f1f1f">nginx</text>

  <line x1="232" y1="160" x2="322" y2="160" stroke="#db7810" stroke-width="3" marker-end="url(#p)"/>
  <line x1="462" y1="170" x2="612" y2="180" stroke="#db7810" stroke-width="3" marker-end="url(#p)"/>
  <text x="525" y="225" text-anchor="middle" font-size="14" fill="#db7810" font-weight="700">-p 8080:80</text>
  <text x="480" y="288" text-anchor="middle" font-size="13" fill="#555">Sin -p, el servicio funciona dentro del contenedor, pero desde fuera no se puede llegar a él.</text>
</svg>
