<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="fl" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,1 L13,7 L0,13 z" fill="#db7810"/></marker></defs>
<rect width="960" height="810" rx="18" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f1f1f">Ramas: etiquetas que se mueven</text>
<rect x="20" y="50" width="920" height="230" rx="14" fill="#f3f8fd" stroke="#2f80c8" stroke-width="1.5"/>
<text x="40" y="80" font-size="16" font-weight="700" fill="#1f1f1f">1 · Una rama es una etiqueta que apunta a un commit</text>
<line x1="645" y1="100" x2="645" y2="260" stroke="#c9dcef" stroke-width="1.5"/>
<text x="665" y="125" font-size="14" fill="#444">Crear una rama no copia</text>
<text x="665" y="147" font-size="14" fill="#444">archivos: solo añade una</text>
<text x="665" y="169" font-size="14" fill="#444">etiqueta. Cada commit nuevo</text>
<text x="665" y="191" font-size="14" fill="#444">mueve la etiqueta de la rama</text>
<text x="665" y="213" font-size="14" fill="#444">en la que estás (HEAD); main</text>
<text x="665" y="235" font-size="14" fill="#444">se queda donde estaba.</text>
<line x1="290" y1="225" x2="360" y2="170" stroke="#db7810" stroke-width="3"/>
<line x1="360" y1="170" x2="430" y2="170" stroke="#db7810" stroke-width="3"/>
<line x1="80" y1="225" x2="290" y2="225" stroke="#2f80c8" stroke-width="3"/>
<circle cx="80" cy="225" r="16" fill="#2f80c8"/>
<text x="80" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
<circle cx="150" cy="225" r="16" fill="#2f80c8"/>
<text x="150" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text>
<circle cx="220" cy="225" r="16" fill="#2f80c8"/>
<text x="220" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C</text>
<circle cx="290" cy="225" r="16" fill="#2f80c8"/>
<text x="290" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">D</text>
<circle cx="360" cy="170" r="16" fill="#db7810"/>
<text x="360" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">E</text>
<circle cx="430" cy="170" r="16" fill="#db7810"/>
<text x="430" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">F</text>
<rect x="265" y="253" width="50" height="22" rx="5" fill="#2f80c8"/>
<text x="290" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">main</text>
<line x1="290" y1="241" x2="290" y2="253" stroke="#2f80c8" stroke-width="2"/>
<rect x="368" y="120" width="124" height="22" rx="5" fill="#db7810"/>
<text x="430" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">readme-docker</text>
<line x1="430" y1="142" x2="430" y2="154" stroke="#db7810" stroke-width="2"/>
<rect x="517" y="120" width="50" height="22" rx="5" fill="#1f1f1f"/>
<text x="542" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">HEAD</text>
<line x1="515" y1="131" x2="496" y2="131" stroke="#1f1f1f" stroke-width="2"/>
<text x="542" y="160" text-anchor="middle" font-size="12" fill="#444">estás aquí</text>
<rect x="20" y="300" width="920" height="200" rx="14" fill="#f3f8fd" stroke="#2f80c8" stroke-width="1.5"/>
<text x="40" y="330" font-size="16" font-weight="700" fill="#1f1f1f">2 · Fusión fast-forward:<tspan font-family="ui-monospace, Menlo, monospace" fill="#db7810">  git merge readme-docker</tspan></text>
<line x1="645" y1="350" x2="645" y2="480" stroke="#c9dcef" stroke-width="1.5"/>
<text x="665" y="375" font-size="14" fill="#444">main no ha cambiado desde que</text>
<text x="665" y="397" font-size="14" fill="#444">salió la rama, así que no hay</text>
<text x="665" y="419" font-size="14" fill="#444">nada que combinar: Git solo</text>
<text x="665" y="441" font-size="14" fill="#444">adelanta la etiqueta main</text>
<text x="665" y="463" font-size="14" fill="#444">hasta F. No se crea ningún</text>
<text x="665" y="485" font-size="14" fill="#444">commit nuevo.</text>
<line x1="80" y1="435" x2="430" y2="435" stroke="#2f80c8" stroke-width="3"/>
<circle cx="80" cy="435" r="16" fill="#2f80c8"/>
<text x="80" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
<circle cx="150" cy="435" r="16" fill="#2f80c8"/>
<text x="150" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text>
<circle cx="220" cy="435" r="16" fill="#2f80c8"/>
<text x="220" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C</text>
<circle cx="290" cy="435" r="16" fill="#2f80c8"/>
<text x="290" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">D</text>
<circle cx="360" cy="435" r="16" fill="#db7810"/>
<text x="360" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">E</text>
<circle cx="430" cy="435" r="16" fill="#db7810"/>
<text x="430" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">F</text>
<rect x="265" y="361" width="50" height="22" rx="5" fill="#fff" stroke="#2f80c8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="290" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#2f80c8" font-family="ui-monospace, Menlo, monospace">main</text>
<line x1="290" y1="383" x2="290" y2="419" stroke="#2f80c8" stroke-width="2"/>
<rect x="405" y="361" width="50" height="22" rx="5" fill="#2f80c8"/>
<text x="430" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">main</text>
<rect x="368" y="387" width="124" height="22" rx="5" fill="#db7810"/>
<text x="430" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">readme-docker</text>
<line x1="430" y1="409" x2="430" y2="419" stroke="#db7810" stroke-width="2"/>
<line x1="320" y1="372" x2="400" y2="372" stroke="#db7810" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#fl)"/>
<text x="360" y="480" text-anchor="middle" font-size="12" fill="#444">E y F se hicieron en la rama; ahora también son de main</text>
<rect x="20" y="520" width="920" height="250" rx="14" fill="#f3f8fd" stroke="#2f80c8" stroke-width="1.5"/>
<text x="40" y="550" font-size="16" font-weight="700" fill="#1f1f1f">3 · Commit de fusión:<tspan font-family="ui-monospace, Menlo, monospace" fill="#db7810">  git merge umbral-alto</tspan></text>
<line x1="645" y1="570" x2="645" y2="750" stroke="#c9dcef" stroke-width="1.5"/>
<text x="665" y="595" font-size="14" fill="#444">Las dos ramas tienen commits</text>
<text x="665" y="617" font-size="14" fill="#444">propios. Git los combina en un</text>
<text x="665" y="639" font-size="14" fill="#444">commit nuevo, M, con dos padres.</text>
<text x="665" y="661" font-size="14" fill="#444">Si las dos cambiaron la misma</text>
<text x="665" y="683" font-size="14" fill="#444">línea, hay un conflicto y</text>
<text x="665" y="705" font-size="14" fill="#444">decides tú cómo queda.</text>
<line x1="290" y1="685" x2="380" y2="625" stroke="#db7810" stroke-width="3"/>
<line x1="380" y1="625" x2="490" y2="685" stroke="#db7810" stroke-width="3"/>
<line x1="290" y1="685" x2="490" y2="685" stroke="#2f80c8" stroke-width="3"/>
<line x1="80" y1="685" x2="290" y2="685" stroke="#2f80c8" stroke-width="3"/>
<circle cx="80" cy="685" r="16" fill="#2f80c8"/>
<text x="80" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
<circle cx="150" cy="685" r="16" fill="#2f80c8"/>
<text x="150" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text>
<circle cx="220" cy="685" r="16" fill="#2f80c8"/>
<text x="220" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C</text>
<circle cx="290" cy="685" r="16" fill="#2f80c8"/>
<text x="290" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">D</text>
<circle cx="380" cy="625" r="16" fill="#db7810"/>
<text x="380" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">G</text>
<circle cx="380" cy="685" r="16" fill="#2f80c8"/>
<text x="380" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">H</text>
<circle cx="490" cy="685" r="22" fill="none" stroke="#2f80c8" stroke-width="2"/>
<circle cx="490" cy="685" r="16" fill="#2f80c8"/>
<text x="490" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">M</text>
<rect x="326" y="575" width="108" height="22" rx="5" fill="#db7810"/>
<text x="380" y="591" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">umbral-alto</text>
<line x1="380" y1="597" x2="380" y2="609" stroke="#db7810" stroke-width="2"/>
<text x="406" y="630" font-size="12" fill="#444" font-family="ui-monospace, Menlo, monospace">200_000</text>
<text x="380" y="723" text-anchor="middle" font-size="12" fill="#444" font-family="ui-monospace, Menlo, monospace">50_000</text>
<rect x="465" y="715" width="50" height="22" rx="5" fill="#2f80c8"/>
<text x="490" y="731" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="ui-monospace, Menlo, monospace">main</text>
<line x1="490" y1="707" x2="490" y2="715" stroke="#2f80c8" stroke-width="2"/>
<text x="522" y="681" font-size="12" fill="#444" font-family="ui-monospace, Menlo, monospace">100_000</text>
<text x="522" y="698" font-size="12" fill="#444">2 padres: G y H</text>
<text x="480" y="796" text-anchor="middle" font-size="13" fill="#444">Cada círculo es un commit y el tiempo avanza hacia la derecha. Las etiquetas de colores son ramas.</text>
</svg>
